name: splitpay

x-app-defaults: &app-defaults
  restart: unless-stopped
  networks:
    - splitpay-network

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitpay_transactions
      POSTGRES_USER: ${POSTGRES_USER:-splitpay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d splitpay_transactions"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - splitpay-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-splitpay}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${RABBITMQ_PORT:-5672}:5672"
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - splitpay-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev-password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${KEYCLOAK_PORT:-9182}:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    networks:
      - splitpay-network

  transaction-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-transaction-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-transaction-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/splitpay_transactions
      DB_USER: ${POSTGRES_USER:-splitpay}
      DB_PASS: ${POSTGRES_PASSWORD:-splitpay-dev-password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-splitpay}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${TRANSACTION_PORT:-9081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  conciliation-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-conciliation-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-conciliation-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/splitpay_conciliation
      DB_USER: ${POSTGRES_USER:-splitpay}
      DB_PASS: ${POSTGRES_PASSWORD:-splitpay-dev-password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-splitpay}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${CONCILIATION_PORT:-9082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  auth-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-auth-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-auth-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/splitpay_auth
      DB_USER: ${POSTGRES_USER:-splitpay}
      DB_PASS: ${POSTGRES_PASSWORD:-splitpay-dev-password}
      JWT_SECRET: ${JWT_SECRET:-53504c49545041592d4445562d4f4e4c592d4348414e47452d4d452d32303236}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      FRONTEND_URL: ${PUBLIC_BASE_URL:-http://localhost:9080}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${AUTH_PORT:-9084}:8084"
    depends_on:
      postgres:
        condition: service_healthy

  reports-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-reports-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-reports-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/splitpay_transactions
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-splitpay}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${REPORTS_PORT:-9086}:8086"
    depends_on:
      postgres:
        condition: service_healthy
      transaction-service:
        condition: service_started

  notification-service:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-notification-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-notification-service/Dockerfile
    environment:
      SERVER_PORT: 8087
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-splitpay}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-splitpay-dev-password}
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${NOTIFICATION_PORT:-9087}:8087"
    depends_on:
      rabbitmq:
        condition: service_healthy

  api-gateway:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-api-gateway:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-api-gateway/Dockerfile
    environment:
      TRANSACTION_SERVICE_URL: http://transaction-service:8081
      AUTH_SERVICE_URL: http://auth-service:8084
      REPORTS_SERVICE_URL: http://reports-service:8086
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/splitpay
    ports:
      - "${PRIVATE_BIND_ADDRESS:-0.0.0.0}:${GATEWAY_PORT:-9085}:8085"
    depends_on:
      transaction-service:
        condition: service_started
      auth-service:
        condition: service_started
      reports-service:
        condition: service_started
      keycloak:
        condition: service_started

  frontend:
    <<: *app-defaults
    image: ${IMAGE_PREFIX:-splitpay}-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: splitpay-frontend/Dockerfile
    environment:
      GATEWAY_URL: http://api-gateway:8085
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:9084}
      SPRING_THYMELEAF_CACHE: "false"
    ports:
      - "${PUBLIC_BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-9080}:8080"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  keycloak-data:

networks:
  splitpay-network:
    driver: bridge
